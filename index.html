<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GranCole</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <div class="left">
        
    </div>
        
    <div class="right">
        <div class="login-card">
            <img src="./imgs/logo1.png" alt="Logo" class="logo">
            <h2>Bienvenido a GranCole</h2>
            <p class="subtitle">Inicia sesión para continuar</p>

            <form>
                <label for="usuario">Usuario</label>
                <div class="input-group">
                    <span class="icon">👤</span>
                    <input type="text" id="usuario" placeholder="0000000" required>
                </div>

                <label for="password">Contraseña</label>
                <div class="input-group">
                    <span class="icon">🔒</span>
                    <input type="password" id="password" placeholder="********" required>
                </div>

                <a href="#" class="forgot">¿Olvidaste tu contraseña?</a>

                <button type="submit" class="btn">Iniciar Sesión →</button>
            </form>

            <p class="register">¿No tienes cuenta? <a href="#">Contacta al administrador</a></p>
            <small>© 2025 GranCole Pro. Todos los derechos reservados.</small>
        </div>
    </div>
</div>

</body>
</html>
